<!doctype html>
<meta charset="utf-8" />
<title>Hyperporter — social card</title>
<!--
  Source for public/og.png, the sitewide Open Graph / Twitter card.

  Drawn from the homepage hero so a shared link looks like the site it leads
  to: the same #0B0A09 ground, the same Natural Earth map at the same two
  opacities (covered .30, uncovered .055), the same scrim, the same Newsreader
  display cut and Hyperlocal ROM wordmark. No amber — on this site amber means
  "a step a person must touch" and is never decorative.

  This is a template, not a standalone page. scripts/og/render.mjs fills the
  three placeholders below:

    NEWSREADER   data URI for newsreader-400.woff2, vendored beside this
                 file (SIL OFL 1.1 — see newsreader-LICENSE.txt)
    HYPERLOCAL   data URI for public/fonts/hyperlocal-rom-regular.woff2
    MAP          the projected world map lifted from the built homepage, so
                 the card's coverage can never drift from the site's

  Each name above appears in the markup wrapped in double braces. They are
  written without the braces here so the renderer's substitution cannot
  accidentally target this comment instead of the real placeholder.

  Fonts go in as data URIs rather than links so rendering never depends on
  Google Fonts being reachable and the output is byte-stable.

  Regenerate with:  node scripts/og/render.mjs
-->
<style>
  @font-face{font-family:'Newsreader';src:url({{NEWSREADER}}) format('woff2');font-weight:400;font-style:normal}
  @font-face{font-family:'Hyperlocal ROM';src:url({{HYPERLOCAL}}) format('woff2');font-weight:400;font-style:normal}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;background:#0B0A09;color:#fff;
    font-family:'Hyperlocal ROM','Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* Map, sized and centred as .hx-shero-map does on the homepage. */
  .map{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .map svg{flex:none;width:112%;max-width:none;height:auto;display:block}
  .map .wm-on path,.map .wm-dots circle{fill:rgba(255,255,255,.30);stroke:none}
  .map .wm-base path{fill:rgba(255,255,255,.055);stroke:none}

  /* .hx-shero::after, re-aimed at this canvas: pulls the lower-left dark so
     the type sits on solid ground while the map still reads across the top. */
  .scrim{position:absolute;inset:0;background:
    radial-gradient(115% 95% at 14% 88%,rgba(11,10,9,.95),rgba(11,10,9,.46) 56%,transparent 78%),
    linear-gradient(180deg,rgba(11,10,9,.70) 0%,transparent 30%,rgba(11,10,9,.72) 100%)}

  .in{position:absolute;inset:0;z-index:2;padding:64px 72px;display:flex;flex-direction:column}

  /* Wordmark — .mark, scaled for a 1200px canvas. */
  .mark{display:flex;align-items:center;gap:15px}
  .mark .glyph{width:37px;height:37px;display:block;color:#fff}
  .mark .glyph svg{width:100%;height:100%;display:block}
  .mark .glyph rect{fill:currentColor}
  .mark .glyph .ring{fill:none;stroke:currentColor;stroke-width:5;
    stroke-dasharray:54.1 15;stroke-dashoffset:61.6;stroke-linecap:butt}
  .word{font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:21px;
    letter-spacing:.13em;text-transform:uppercase;color:#fff}

  .foot{margin-top:auto}
  /* .hx-shero-h: Newsreader 400, line-height 1.0, -.014em. */
  h1{font-family:'Newsreader',Georgia,'Times New Roman',serif;font-weight:400;
    font-size:86px;line-height:1.0;letter-spacing:-.014em;max-width:15ch;margin-bottom:26px}
  p{font-size:23px;line-height:1.45;color:rgba(255,255,255,.78);
    letter-spacing:-.008em;max-width:none;white-space:nowrap}
  /* One hairline, echoing the rules the site uses to separate blocks. */
  .rule{width:88px;height:1px;background:rgba(255,255,255,.30);margin-bottom:30px}
</style>

<div class="map">{{MAP}}</div>
<div class="scrim"></div>

<div class="in">
  <div class="mark">
    <span class="glyph"><svg viewBox="0 0 100 100"
      ><circle class="ring" cx="50" cy="50" r="44"></circle
      ><rect x="32.5" y="26" width="7.5" height="47"></rect
      ><rect x="60" y="26" width="7.5" height="47"></rect
      ><rect x="32.5" y="46.5" width="35" height="7.5"></rect></svg></span>
    <span class="word">Hyperporter</span>
  </div>

  <div class="foot">
    <div class="rule"></div>
    <h1>Run trips on autopilot.</h1>
    <p>Autopilot software and the Horizon operator network &mdash; 137 countries.</p>
  </div>
</div>
