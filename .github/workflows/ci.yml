name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: astro check && astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: astro check
        run: npx astro check

      - name: astro build
        run: npx astro build
        env:
          # Build CI as a production deployment would be, so the SEO check
          # below exercises the indexable path (canonicals, sitemap, robots)
          # rather than the all-noindex preview path.
          SITE_URL: https://ci.invalid
          SITE_INDEXABLE: 'true'

      - name: SEO invariants
        run: node scripts/check-seo.mjs
